[project]
name = "compose-application"
version = "0.1.0.dev0"
description = "Optional composition of typed storage, APIs and spatial interfaces."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "ellainng" }]
dependencies = []

[project.optional-dependencies]
validation = ["expose-api[backpack,enforce-type] @ git+https://github.com/outside-labs/expose_api.git@c20ce4aa3487d4913b56ff244a031f83de2df285"]
service = ["expose-api[backpack] @ git+https://github.com/outside-labs/expose_api.git@5d284e18bce7ae9f07ba64ac9297dad55a3fc5b1"]
ui = [
    "expose-api[backpack] @ git+https://github.com/outside-labs/expose_api.git@5d284e18bce7ae9f07ba64ac9297dad55a3fc5b1",
    "spatial-ui @ git+https://github.com/outside-labs/spatial_ui.git@9e473497febdc505e54ba25536b65b68722d264b",
]
live = [
    "expose-api[backpack] @ git+https://github.com/outside-labs/expose_api.git@5d284e18bce7ae9f07ba64ac9297dad55a3fc5b1",
    "spatial-ui @ git+https://github.com/outside-labs/spatial_ui.git@9e473497febdc505e54ba25536b65b68722d264b",
]

[project.urls]
Source = "https://github.com/outside-labs/compose_application"
Issues = "https://github.com/outside-labs/compose_application/issues"
Project = "https://github.com/orgs/outside-labs/projects/18"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
browser-tests = ["playwright==1.64.0"]

[tool.uv]
conflicts = [
    [{ extra = "validation" }, { extra = "service" }],
    [{ extra = "validation" }, { extra = "ui" }],
    [{ extra = "validation" }, { extra = "live" }],
]
