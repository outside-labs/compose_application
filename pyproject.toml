[project]
name = "compose-application"
version = "0.1.0.dev0"
description = "Optional composition of typed storage, APIs and spatial interfaces."
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "ellainng" }]
dependencies = []

[project.optional-dependencies]
service = ["expose-api[backpack] @ git+https://github.com/outside-labs/expose_api.git@01d7c486ae9041532c8bfe01d8a2a00496523e68"]
ui = [
    "expose-api[backpack] @ git+https://github.com/outside-labs/expose_api.git@01d7c486ae9041532c8bfe01d8a2a00496523e68",
    "spatial-ui @ git+https://github.com/outside-labs/spatial_ui.git@cf97352f0d1c4a3f226620bc575ef6dcc2880eaf",
]

[project.urls]
Source = "https://github.com/outside-labs/compose_application"
Issues = "https://github.com/outside-labs/compose_application/issues"
Project = "https://github.com/orgs/outside-labs/projects/18"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
browser-tests = ["playwright==1.64.0"]
